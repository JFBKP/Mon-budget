<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#0F1117">
<meta name="format-detection" content="telephone=no">
<title>Mon Budget</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #0F1117;
    font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #F1F5F9;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }
  body { padding-bottom: env(safe-area-inset-bottom); }
  input {
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
  }
  button { font-family: inherit; }
  #app { position: relative; }
  .row-tap:active { background: rgba(255,255,255,0.08) !important; }
  .btn:active { opacity: 0.7; }
  @keyframes slideDown { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>
<div id="app"></div>

<script>
//─────────────────────────────────────────────────────────
//  DONNÉES
//─────────────────────────────────────────────────────────
var SALARY = 2100;
var MONTHS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
var C = { fixed:"#FF6B9D", variable:"#FB923C", savings:"#34D399", accent:"#A78BFA" };

var DEFAULT_ITEMS = {
  fixed: [
    { id:"credit",     label:"Crédit",                   amount:242, icon:"🏦" },
    { id:"navigo",     label:"Carte Navigo",             amount:37,  icon:"🚇" },
    { id:"salle",      label:"Salle de sport",           amount:34,  icon:"💪" },
    { id:"free",       label:"Free (internet)",          amount:10,  icon:"📡" },
    { id:"solidarite", label:"Solidarités International", amount:10,  icon:"🌍" },
    { id:"sfr",        label:"SFR (mobile)",             amount:9,   icon:"📱" },
    { id:"spotify",    label:"Spotify",                  amount:7,   icon:"🎵" },
    { id:"icloud",     label:"iCloud",                   amount:3,   icon:"☁️" }
  ],
  variable: [
    { id:"essence",  label:"Essence",                    amount:50,  icon:"⛽" },
    { id:"courses",  label:"Courses alimentaires",       amount:40,  icon:"🛒" },
    { id:"loisirs",  label:"Loisirs (dont 50€ cantine)", amount:150, icon:"🎉" },
    { id:"beaute",   label:"Beauté (sourcils…)",         amount:20,  icon:"✨" },
    { id:"eglise",   label:"Église / don",               amount:10,  icon:"🙏" },
    { id:"shopping", label:"Shopping / soldes",          amount:0,   icon:"👗", variable:true }
  ],
  savings: [
    { id:"lep",     label:"LEP",                         amount:120, icon:"🏛️" },
    { id:"revolut", label:"Épargne Revolut (JG)",        amount:80,  icon:"💜" },
    { id:"invest",  label:"Investissement ETF",          amount:50,  icon:"📈" },
    { id:"voyage",  label:"Épargne voyage Gad",          amount:20,  icon:"✈️" },
    { id:"voiture", label:"Épargne voiture (entretien)", amount:30,  icon:"🚗" },
    { id:"cadeaux", label:"Épargne cadeaux",             amount:20,  icon:"🎁" }
  ]
};

//─────────────────────────────────────────────────────────
//  STOCKAGE (localStorage + repli mémoire)
//─────────────────────────────────────────────────────────
var _mem = {};
var store = {
  get: function(k){ try { return localStorage.getItem(k); } catch(e){ return (k in _mem) ? _mem[k] : null; } },
  set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){ _mem[k] = v; } }
};

//─────────────────────────────────────────────────────────
//  ÉTAT
//─────────────────────────────────────────────────────────
var now = new Date();
var state = {
  amounts: {},
  salary: SALARY,
  currentMonth: MONTHS[now.getMonth()] + " " + now.getFullYear(),
  activeTab: "overview",
  editingId: null,
  archives: [],
  viewArchive: null,
  showConfirm: false,
  toast: null
};

// valeurs par défaut
[].concat(DEFAULT_ITEMS.fixed, DEFAULT_ITEMS.variable, DEFAULT_ITEMS.savings)
  .forEach(function(i){ state.amounts[i.id] = i.amount; });

// chargement
(function load(){
  var a = store.get("budget-amounts");  if(a){ try { state.amounts = JSON.parse(a); } catch(e){} }
  var s = store.get("budget-salary");   if(s){ state.salary = parseInt(s) || SALARY; }
  var m = store.get("budget-month");    if(m){ state.currentMonth = m; }
  var r = store.get("budget-archives"); if(r){ try { state.archives = JSON.parse(r); } catch(e){} }
})();

//─────────────────────────────────────────────────────────
//  HELPERS
//─────────────────────────────────────────────────────────
function pct(part){ return Math.round(part / (state.salary || 1) * 100); }

function totals(amts){
  amts = amts || state.amounts;
  var f  = DEFAULT_ITEMS.fixed.reduce(function(s,i){ return s + (amts[i.id]||0); }, 0);
  var v  = DEFAULT_ITEMS.variable.reduce(function(s,i){ return s + (amts[i.id]||0); }, 0);
  var sv = DEFAULT_ITEMS.savings.reduce(function(s,i){ return s + (amts[i.id]||0); }, 0);
  return { f:f, v:v, sv:sv, out:f+v+sv, rest:state.salary-(f+v+sv) };
}

function itemColor(id){
  if(DEFAULT_ITEMS.fixed.some(function(i){return i.id===id;}))    return C.fixed;
  if(DEFAULT_ITEMS.variable.some(function(i){return i.id===id;})) return C.variable;
  return C.savings;
}

function esc(s){ return String(s).replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

//─────────────────────────────────────────────────────────
//  BLOCS HTML
//─────────────────────────────────────────────────────────
function rowHTML(item, opts){
  opts = opts || {};
  var amts = opts.amts || state.amounts;
  var val = amts[item.id] || 0;
  var color = itemColor(item.id);
  var editing = !opts.readOnly && state.editingId === item.id;
  var right;
  if(editing){
    right = '<input data-input="amount" data-id="'+item.id+'" data-focuskey="amount-'+item.id+'" value="'+val+'" inputmode="numeric" '
          + 'style="width:66px;background:rgba(255,255,255,0.1);border:1px solid '+color+';border-radius:7px;color:#fff;'
          + 'padding:4px 7px;font-size:16px;text-align:right;outline:none;">';
  } else {
    right = '<span style="color:'+color+';font-weight:700;font-size:14px;font-family:monospace;">'+val+'€</span>';
  }
  var pencil = opts.readOnly ? '' : '<span style="color:#475569;font-size:11px;">'+(editing?'✓':'✎')+'</span>';
  var tag = opts.readOnly ? '' : 'data-action="edit" data-id="'+item.id+'" class="row-tap"';
  var varBadge = item.variable ? '<span style="font-size:9px;color:#94A3B8;background:rgba(255,255,255,0.08);border-radius:4px;padding:1px 5px;">var.</span>' : '';
  return '<div '+tag+' style="display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:11px;'
       + 'background:rgba(255,255,255,0.04);margin-bottom:5px;border:1px solid rgba(255,255,255,0.06);cursor:'+(opts.readOnly?'default':'pointer')+';transition:background .15s;">'
       + '<div style="display:flex;align-items:center;gap:9px;">'
       +   '<span style="font-size:16px;">'+item.icon+'</span>'
       +   '<span style="color:#CBD5E1;font-size:13px;font-weight:500;">'+item.label+'</span>'+varBadge
       + '</div>'
       + '<div style="display:flex;align-items:center;gap:6px;">'+right+pencil+'</div>'
       + '</div>';
}

function sectionHTML(title, icon, items, color, opts){
  opts = opts || {};
  var amts = opts.amts || state.amounts;
  var sal  = opts.salary || state.salary;
  var total = items.reduce(function(s,i){ return s + (amts[i.id]||0); }, 0);
  var p = Math.round(total / (sal||1) * 100);
  var totalAttr = opts.idKey ? ' id="sec-'+opts.idKey+'-total"' : '';
  var pctAttr   = opts.idKey ? ' id="sec-'+opts.idKey+'-pct"' : '';
  var rows = items.map(function(i){ return rowHTML(i, opts); }).join("");
  return '<div style="background:rgba(255,255,255,0.03);border-radius:16px;border:1px solid '+color+'20;padding:14px;margin-bottom:14px;">'
       + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">'
       +   '<div style="display:flex;align-items:center;gap:7px;"><span style="font-size:18px;">'+icon+'</span>'
       +   '<span style="color:#CBD5E1;font-weight:700;font-size:14px;">'+title+'</span></div>'
       +   '<div'+totalAttr+' style="background:'+color+'22;border-radius:20px;padding:3px 11px;color:'+color+';font-weight:800;font-size:14px;font-family:monospace;">'+total+'€</div>'
       + '</div>'
       + rows
       + '<div style="border-top:1px solid rgba(255,255,255,0.06);padding-top:7px;margin-top:3px;text-align:right;">'
       +   '<span'+pctAttr+' style="color:'+color+';font-weight:700;font-size:12px;">'+p+'% du salaire</span>'
       + '</div>'
       + '</div>';
}

function headerHTML(){
  return '<div style="margin-bottom:20px;">'
       + '<div style="display:flex;justify-content:space-between;align-items:flex-start;">'
       +   '<div>'
       +     '<div style="font-size:10px;letter-spacing:3px;color:#475569;text-transform:uppercase;margin-bottom:4px;">Budget Mensuel</div>'
       +     '<input data-input="month" data-focuskey="month" value="'+esc(state.currentMonth)+'" '
       +       'style="background:transparent;border:none;outline:none;color:#FF6B9D;font-size:22px;font-weight:800;letter-spacing:-0.5px;padding:0;width:210px;">'
       +   '</div>'
       +   '<button class="btn" data-action="open-confirm" style="background:rgba(167,139,250,0.15);border:1px solid rgba(167,139,250,0.35);'
       +     'border-radius:10px;color:'+C.accent+';padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;">🗂️ Archiver</button>'
       + '</div>'
       + '<div style="display:flex;align-items:center;gap:8px;margin-top:6px;">'
       +   '<span style="color:#475569;font-size:12px;">Salaire</span>'
       +   '<div style="display:flex;align-items:center;gap:4px;">'
       +     '<input data-input="salary" data-focuskey="salary" value="'+state.salary+'" inputmode="numeric" '
       +       'style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:7px;color:#F1F5F9;'
       +       'font-weight:700;font-size:16px;padding:3px 8px;width:84px;text-align:right;outline:none;font-family:monospace;">'
       +     '<span style="color:#475569;font-size:14px;">€</span>'
       +   '</div>'
       + '</div>'
       + '</div>';
}

function barHTML(t){
  function seg(id,val,color){
    return '<div id="'+id+'" style="flex:'+Math.max(0,pct(val))+';background:'+color+';height:100%;min-width:'+(val>0?3:0)+'px;"></div>';
  }
  return '<div style="height:8px;border-radius:8px;overflow:hidden;display:flex;margin-bottom:6px;background:#1E2530;">'
       +   seg("seg-fixed",t.f,C.fixed) + seg("seg-var",t.v,C.variable) + seg("seg-sav",t.sv,C.savings)
       +   '<div id="seg-rest" style="flex:'+Math.max(0,pct(t.rest))+';background:#1E2530;"></div>'
       + '</div>'
       + '<div style="display:flex;justify-content:space-between;font-size:10px;color:#475569;margin-bottom:18px;">'
       +   '<span id="lbl-fixed" style="color:'+C.fixed+';">Fixes '+pct(t.f)+'%</span>'
       +   '<span id="lbl-var" style="color:'+C.variable+';">Var. '+pct(t.v)+'%</span>'
       +   '<span id="lbl-sav" style="color:'+C.savings+';">Épargne '+pct(t.sv)+'%</span>'
       +   '<span id="lbl-rest" style="color:'+(t.rest>=0?'#60A5FA':'#F87171')+';">Reste '+Math.max(0,pct(t.rest))+'%</span>'
       + '</div>';
}

function kpiHTML(t){
  var cards = [
    { id:"kpi-dep",  label:"Dépenses",     value:(t.f+t.v)+"€", color:C.fixed,   icon:"💸" },
    { id:"kpi-sav",  label:"Épargné",      value:t.sv+"€",      color:C.savings, icon:"💰" },
    { id:"kpi-rest", label:"Reste",        value:t.rest+"€",    color:(t.rest>=0?"#60A5FA":"#F87171"), icon:(t.rest>=0?"✅":"⚠️") },
    { id:"kpi-taux", label:"Taux épargne", value:pct(t.sv)+"%", color:C.accent,  icon:"📈" }
  ];
  var html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px;">';
  cards.forEach(function(k){
    html += '<div style="background:rgba(255,255,255,0.04);border-radius:13px;padding:11px 13px;border:1px solid '+k.color+'20;">'
          + '<div style="font-size:16px;margin-bottom:3px;">'+k.icon+'</div>'
          + '<div id="'+k.id+'" style="color:'+k.color+';font-weight:800;font-size:20px;font-family:monospace;">'+k.value+'</div>'
          + '<div style="color:#64748B;font-size:11px;margin-top:1px;">'+k.label+'</div>'
          + '</div>';
  });
  return html + '</div>';
}

function tabsHTML(){
  var tabs = [
    { id:"overview", label:"Résumé",    icon:"📊" },
    { id:"fixed",    label:"Fixes",     icon:"🔒" },
    { id:"variable", label:"Variables", icon:"📦" },
    { id:"savings",  label:"Épargne",   icon:"💚" },
    { id:"history",  label:"Historique",icon:"🗂️" }
  ];
  var html = '<div style="display:flex;background:rgba(255,255,255,0.05);border-radius:12px;padding:4px;margin-bottom:16px;gap:2px;">';
  tabs.forEach(function(t){
    var on = state.activeTab === t.id;
    html += '<button class="btn" data-action="tab" data-tab="'+t.id+'" style="flex:1;'
          + 'background:'+(on?'rgba(255,107,157,0.18)':'transparent')+';'
          + 'border:1px solid '+(on?'rgba(255,107,157,0.35)':'transparent')+';'
          + 'border-radius:9px;color:'+(on?'#FF6B9D':'#64748B')+';padding:6px 2px;font-size:9px;font-weight:600;'
          + 'cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;">'
          + '<span style="font-size:13px;">'+t.icon+'</span>'+t.label+'</button>';
  });
  return html + '</div>';
}

function overviewHTML(t){
  var rows = [
    { label:"Prélèvements fixes",      total:t.f,  color:C.fixed,    icon:"🔒", sub:"Crédit 242€ + abonnements "+(t.f-242)+"€", id:"ov-fixed" },
    { label:"Dépenses variables",      total:t.v,  color:C.variable, icon:"📦", sub:"Loisirs, courses, essence, beauté…", id:"ov-var" },
    { label:"Épargne & investissement",total:t.sv, color:C.savings,  icon:"💚", sub:"LEP · Revolut · ETF · Voyage · Voiture · Cadeaux", id:"ov-sav" }
  ];
  var html = "<div>";
  rows.forEach(function(r){
    html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border-radius:13px;'
          + 'background:rgba(255,255,255,0.03);border:1px solid '+r.color+'18;margin-bottom:9px;">'
          + '<div><div style="display:flex;align-items:center;gap:7px;"><span style="font-size:15px;">'+r.icon+'</span>'
          + '<span style="color:#CBD5E1;font-weight:600;font-size:13px;">'+r.label+'</span></div>'
          + '<div style="color:#475569;font-size:11px;margin-top:2px;padding-left:22px;">'+r.sub+'</div></div>'
          + '<span id="'+r.id+'" style="color:'+r.color+';font-weight:800;font-size:17px;font-family:monospace;">'+r.total+'€</span></div>';
  });

  html += '<div style="border-top:1px solid rgba(255,255,255,0.08);padding-top:12px;margin-top:4px;">'
        + '<div style="display:flex;justify-content:space-between;margin-bottom:6px;">'
        +   '<span style="color:#64748B;font-size:13px;">Total sorti</span>'
        +   '<span id="ov-total" style="color:#F1F5F9;font-weight:700;font-size:16px;font-family:monospace;">'+t.out+'€</span>'
        + '</div>'
        + '<div style="height:6px;background:#1E2530;border-radius:6px;overflow:hidden;">'
        +   '<div id="ov-bar" style="height:100%;width:'+Math.min(100,pct(t.out))+'%;'
        +     'background:'+(t.out>state.salary?'#F87171':'linear-gradient(90deg,'+C.fixed+','+C.variable+','+C.savings+')')+';border-radius:6px;transition:width .3s;"></div>'
        + '</div>'
        + '<div id="ov-pct" style="text-align:right;font-size:10px;color:#475569;margin-top:3px;">'+Math.min(100,pct(t.out))+'% du salaire utilisé</div>'
        + '</div>';

  html += '<div id="ov-reste-box" style="margin-top:12px;background:'+(t.rest>=0?'rgba(52,211,153,0.07)':'rgba(248,113,113,0.07)')+';'
        + 'border:1px solid '+(t.rest>=0?'#34D39928':'#F8717128')+';border-radius:13px;padding:11px 15px;display:flex;justify-content:space-between;align-items:center;">'
        + '<span style="color:#94A3B8;font-size:13px;">💳 Reste à disposition</span>'
        + '<span id="ov-reste" style="color:'+(t.rest>=0?'#34D399':'#F87171')+';font-weight:800;font-size:22px;font-family:monospace;">'+t.rest+'€</span>'
        + '</div>';

  html += '<div style="margin-top:10px;color:#334155;font-size:11px;text-align:center;">Appuie sur ✎ pour modifier · 🗂️ pour archiver le mois</div>';
  return html + "</div>";
}

function objectivesHTML(){
  var objs = ["20 000€ tous comptes confondus","Remplir Livret Jeune + LEP","Augmenter dons Solidarité Intl","Respecter mon budget chaque mois"];
  var html = '<div style="background:rgba(167,139,250,0.07);border:1px solid rgba(167,139,250,0.18);border-radius:14px;padding:13px 15px;">'
           + '<div style="color:'+C.accent+';font-weight:700;font-size:13px;margin-bottom:8px;">🎯 Objectifs 2026</div>';
  objs.forEach(function(o){
    html += '<div style="display:flex;gap:8px;align-items:center;margin-bottom:5px;">'
          + '<span style="color:'+C.accent+';font-size:11px;">◦</span>'
          + '<span style="color:#94A3B8;font-size:13px;">'+o+'</span></div>';
  });
  return html + '</div>';
}

function archiveCardHTML(arc){
  var r = arc.salary - arc.totalFixed - arc.totalVariable - arc.totalSavings;
  var sel = state.viewArchive === arc.month;
  var html = '<div data-action="view-archive" data-month="'+esc(arc.month)+'" class="row-tap" style="background:'+(sel?'rgba(167,139,250,0.12)':'rgba(255,255,255,0.03)')+';'
           + 'border:1px solid '+(sel?C.accent+'60':'rgba(255,255,255,0.08)')+';border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:all .15s;">'
           + '<div style="display:flex;justify-content:space-between;align-items:center;">'
           +   '<div><div style="color:'+(sel?C.accent:'#CBD5E1')+';font-weight:700;font-size:14px;">'+arc.month+'</div>'
           +   '<div style="color:#475569;font-size:11px;margin-top:2px;">Salaire '+arc.salary+'€ · Épargne '+arc.totalSavings+'€</div></div>'
           +   '<div style="text-align:right;"><div style="color:'+(r>=0?'#34D399':'#F87171')+';font-weight:800;font-size:16px;font-family:monospace;">'+(r>=0?'+':'')+r+'€</div>'
           +   '<div style="color:#475569;font-size:10px;">reste</div></div>'
           + '</div>';

  if(sel){
    var mini = [
      { label:"🔒 Fixes",     val:arc.totalFixed,    color:C.fixed },
      { label:"📦 Variables", val:arc.totalVariable, color:C.variable },
      { label:"💚 Épargne",   val:arc.totalSavings,  color:C.savings }
    ];
    html += '<div style="margin-top:12px;border-top:1px solid rgba(255,255,255,0.08);padding-top:10px;" onclick="event.stopPropagation()">';
    mini.forEach(function(m){
      html += '<div style="display:flex;justify-content:space-between;margin-bottom:5px;font-size:13px;">'
            + '<span style="color:#94A3B8;">'+m.label+'</span>'
            + '<span style="color:'+m.color+';font-weight:700;font-family:monospace;">'+m.val+'€</span></div>';
    });
    var ro = { readOnly:true, amts:arc.amounts, salary:arc.salary };
    html += '<div style="margin-top:8px;">'
          + sectionHTML("Prélèvements fixes","🔒",DEFAULT_ITEMS.fixed,C.fixed,ro)
          + sectionHTML("Dépenses variables","📦",DEFAULT_ITEMS.variable,C.variable,ro)
          + sectionHTML("Épargne","💚",DEFAULT_ITEMS.savings,C.savings,ro)
          + '</div></div>';
  }
  return html + '</div>';
}

function historyHTML(){
  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">'
           + '<span style="color:#CBD5E1;font-weight:700;font-size:14px;">🗂️ Mois archivés ('+state.archives.length+')</span></div>';
  if(state.archives.length === 0){
    html += '<div style="background:rgba(255,255,255,0.03);border:1px dashed rgba(255,255,255,0.1);border-radius:14px;padding:32px 20px;text-align:center;">'
          + '<div style="font-size:32px;margin-bottom:10px;">🗂️</div>'
          + '<div style="color:#64748B;font-size:13px;">Aucun mois archivé pour l\'instant.</div>'
          + '<div style="color:#334155;font-size:11px;margin-top:6px;">Appuie sur « Archiver » en haut pour sauvegarder le mois en cours.</div></div>';
  } else {
    var arr = state.archives.slice().reverse();
    arr.forEach(function(a){ html += archiveCardHTML(a); });
  }
  return html;
}

function modalHTML(){
  return '<div style="position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:50;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s;">'
       + '<div style="background:#1A1F2E;border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:28px 22px;width:88%;max-width:340px;'
       +   'box-shadow:0 8px 40px rgba(0,0,0,0.6);animation:pop .18s;">'
       +   '<div style="font-size:30px;text-align:center;margin-bottom:12px;">🗂️</div>'
       +   '<div style="color:#F1F5F9;font-weight:700;font-size:16px;text-align:center;margin-bottom:8px;">Archiver '+esc(state.currentMonth)+' ?</div>'
       +   '<div style="color:#64748B;font-size:13px;text-align:center;line-height:1.5;margin-bottom:22px;">Les chiffres actuels seront sauvegardés et consultables à tout moment dans l\'historique.</div>'
       +   '<div style="display:flex;gap:10px;">'
       +     '<button class="btn" data-action="close-confirm" style="flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:11px;color:#94A3B8;padding:12px;font-size:14px;cursor:pointer;font-weight:600;">Annuler</button>'
       +     '<button class="btn" data-action="do-archive" style="flex:1;background:rgba(167,139,250,0.25);border:1px solid rgba(167,139,250,0.5);border-radius:11px;color:'+C.accent+';padding:12px;font-size:14px;font-weight:700;cursor:pointer;">✓ Confirmer</button>'
       +   '</div>'
       + '</div></div>';
}

function toastHTML(){
  var ok = state.toast.type !== "error";
  return '<div style="position:fixed;top:16px;left:50%;transform:translateX(-50%);background:'+(ok?'#064E3B':'#7F1D1D')+';'
       + 'border:1px solid '+(ok?'#34D399':'#F87171')+'50;color:#F1F5F9;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:600;'
       + 'z-index:60;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.5);animation:slideDown .2s;">'+state.toast.msg+'</div>';
}

function tabContentHTML(t){
  switch(state.activeTab){
    case "fixed":    return sectionHTML("Prélèvements fixes","🔒",DEFAULT_ITEMS.fixed,C.fixed,{idKey:"fixed"});
    case "variable": return sectionHTML("Dépenses variables","📦",DEFAULT_ITEMS.variable,C.variable,{idKey:"var"});
    case "savings":  return sectionHTML("Épargne & investissement","💚",DEFAULT_ITEMS.savings,C.savings,{idKey:"sav"}) + objectivesHTML();
    case "history":  return historyHTML();
    default:         return overviewHTML(t);
  }
}

//─────────────────────────────────────────────────────────
//  RENDU
//─────────────────────────────────────────────────────────
var app = document.getElementById("app");

function buildApp(){
  var t = totals();
  return '<div style="min-height:100vh;padding:20px 16px 60px;max-width:480px;margin:0 auto;">'
       + (state.showConfirm ? modalHTML() : "")
       + (state.toast ? toastHTML() : "")
       + headerHTML()
       + barHTML(t)
       + kpiHTML(t)
       + tabsHTML()
       + tabContentHTML(t)
       + '</div>';
}

function render(){
  app.innerHTML = buildApp();
}

// Mise à jour des totaux SANS reconstruire (préserve le focus pendant la saisie)
function patchTotals(){
  var t = totals();
  function set(id,txt){ var e=document.getElementById(id); if(e) e.textContent=txt; }
  function flex(id,val){ var e=document.getElementById(id); if(e) e.style.flex=Math.max(0,pct(val)); }
  function col(id,c){ var e=document.getElementById(id); if(e) e.style.color=c; }

  flex("seg-fixed",t.f); flex("seg-var",t.v); flex("seg-sav",t.sv);
  var rseg=document.getElementById("seg-rest"); if(rseg) rseg.style.flex=Math.max(0,pct(t.rest));

  set("lbl-fixed","Fixes "+pct(t.f)+"%");
  set("lbl-var","Var. "+pct(t.v)+"%");
  set("lbl-sav","Épargne "+pct(t.sv)+"%");
  set("lbl-rest","Reste "+Math.max(0,pct(t.rest))+"%"); col("lbl-rest",t.rest>=0?"#60A5FA":"#F87171");

  set("kpi-dep",(t.f+t.v)+"€");
  set("kpi-sav",t.sv+"€");
  set("kpi-rest",t.rest+"€"); col("kpi-rest",t.rest>=0?"#60A5FA":"#F87171");
  set("kpi-taux",pct(t.sv)+"%");

  set("ov-fixed",t.f+"€"); set("ov-var",t.v+"€"); set("ov-sav",t.sv+"€");
  set("ov-total",t.out+"€");
  var ob=document.getElementById("ov-bar"); if(ob){ ob.style.width=Math.min(100,pct(t.out))+"%"; ob.style.background=(t.out>state.salary?"#F87171":"linear-gradient(90deg,"+C.fixed+","+C.variable+","+C.savings+")"); }
  set("ov-pct",Math.min(100,pct(t.out))+"% du salaire utilisé");
  set("ov-reste",t.rest+"€"); col("ov-reste",t.rest>=0?"#34D399":"#F87171");
  var rb=document.getElementById("ov-reste-box");
  if(rb){ rb.style.background=t.rest>=0?"rgba(52,211,153,0.07)":"rgba(248,113,113,0.07)"; rb.style.border="1px solid "+(t.rest>=0?"#34D39928":"#F8717128"); }

  set("sec-fixed-total",t.f+"€"); set("sec-fixed-pct",pct(t.f)+"% du salaire");
  set("sec-var-total",t.v+"€");   set("sec-var-pct",pct(t.v)+"% du salaire");
  set("sec-sav-total",t.sv+"€");  set("sec-sav-pct",pct(t.sv)+"% du salaire");
}

//─────────────────────────────────────────────────────────
//  ACTIONS
//─────────────────────────────────────────────────────────
function showToast(msg,type){
  state.toast = { msg:msg, type:type||"success" };
  render();
  setTimeout(function(){ state.toast=null; render(); }, 2600);
}

function doArchive(){
  var t = totals();
  var snap = {
    month: state.currentMonth, salary: state.salary, amounts: Object.assign({}, state.amounts),
    totalFixed: t.f, totalVariable: t.v, totalSavings: t.sv, remaining: t.rest, archivedAt: new Date().toISOString()
  };
  var exist = state.archives.filter(function(a){ return a.month===state.currentMonth; })[0];
  if(exist){
    state.archives = state.archives.map(function(a){ return a.month===state.currentMonth ? snap : a; });
  } else {
    state.archives = state.archives.concat([snap]);
  }
  store.set("budget-archives", JSON.stringify(state.archives));
  state.showConfirm = false;
  showToast("✅ "+state.currentMonth+" archivé");
}

//─────────────────────────────────────────────────────────
//  ÉVÉNEMENTS (délégation)
//─────────────────────────────────────────────────────────
app.addEventListener("input", function(e){
  var d = e.target.dataset;
  if(d.input === "amount"){
    state.amounts[d.id] = parseInt((e.target.value||"").replace(/\D/g,"")) || 0;
    store.set("budget-amounts", JSON.stringify(state.amounts));
    patchTotals();
  } else if(d.input === "salary"){
    state.salary = parseInt((e.target.value||"").replace(/\D/g,"")) || 0;
    store.set("budget-salary", String(state.salary));
    patchTotals();
  } else if(d.input === "month"){
    state.currentMonth = e.target.value;
    store.set("budget-month", state.currentMonth);
  }
});

app.addEventListener("focusout", function(e){
  if(e.target.dataset && e.target.dataset.input === "amount"){
    state.editingId = null;
    render();
  }
});

app.addEventListener("click", function(e){
  var node = e.target.closest("[data-action]");
  if(!node) return;
  var a = node.dataset.action;

  if(a === "tab"){
    state.activeTab = node.dataset.tab; state.editingId = null; render();
  } else if(a === "open-confirm"){
    state.showConfirm = true; render();
  } else if(a === "close-confirm"){
    state.showConfirm = false; render();
  } else if(a === "do-archive"){
    doArchive();
  } else if(a === "view-archive"){
    state.viewArchive = (state.viewArchive === node.dataset.month) ? null : node.dataset.month; render();
  } else if(a === "edit"){
    if(e.target.tagName === "INPUT") return;
    var id = node.dataset.id;
    state.editingId = (state.editingId === id) ? null : id;
    render();
    if(state.editingId){
      var inp = document.querySelector('[data-focuskey="amount-'+id+'"]');
      if(inp){ inp.focus(); inp.select(); }
    }
  }
});

//─────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
